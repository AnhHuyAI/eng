<!-- app/templates/auth/login.html -->

{% extends 'base.html' %}

{% block title %}Đăng nhập - IELTS AI Platform{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh; padding: 2rem 0;">
        <div class="col-md-6 col-lg-5">
            <div class="glass p-5 text-center">
                <!-- Logo -->
                <div class="mb-4">
                    <div style="width: 80px; height: 80px; margin: 0 auto; border-radius: 20px; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-lg);">
                        <i class="fas fa-graduation-cap" style="font-size: 2rem; color: white;"></i>
                    </div>
                </div>
                
                <h1 class="text-gradient mb-2">IELTS AI Platform</h1>
                <p class="text-muted mb-4">Chọn tài khoản để đăng nhập</p>
                
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-4">
                        <label class="form-label text-start w-100">Chọn tài khoản:</label>
                        <select name="email" class="form-select" required>
                            <option value="">-- Chọn user --</option>
                            {% for user in users %}
                                <option value="{{ user.email }}">
                                    {{ user.full_name or user.email }} 
                                    {% if user.is_admin() %}(Admin){% endif %}
                                    - {{ user.credits }} credits
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-sign-in-alt"></i> Đăng nhập
                    </button>
                </form>
                
                <div class="mt-4 pt-4" style="border-top: 1px solid var(--border-color);">
                    <p class="text-muted mb-0">
                        <i class="fas fa-info-circle"></i> 
                        Demo mode - Chỉ cần chọn user, không cần password
                    </p>
                </div>
            </div>
            
            <!-- Feature highlights -->
            <div class="row mt-4">
                <div class="col-4">
                    <div class="glass p-3 text-center">
                        <i class="fas fa-robot text-gradient" style="font-size: 1.5rem;"></i>
                        <p class="mb-0 mt-2 small">AI Scoring</p>
                    </div>
                </div>
                <div class="col-4">
                    <div class="glass p-3 text-center">
                        <i class="fas fa-chart-line text-gradient" style="font-size: 1.5rem;"></i>
                        <p class="mb-0 mt-2 small">Progress Tracking</p>
                    </div>
                </div>
                <div class="col-4">
                    <div class="glass p-3 text-center">
                        <i class="fas fa-clock text-gradient" style="font-size: 1.5rem;"></i>
                        <p class="mb-0 mt-2 small">24/7 Practice</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
