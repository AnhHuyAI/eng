<!-- app/templates/admin/listening/section_add.html -->

{% extends 'base.html' %}

{% block title %}Add Listening Section - Admin{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Header -->
            <div class="glass p-4 mb-4">
                <a href="{{ url_for('admin.listening_sections') }}" class="btn btn-ghost btn-sm mb-3">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
                <h1 class="text-gradient mb-2">
                    <i class="fas fa-plus"></i> Add Listening Section
                </h1>
            </div>
            
            <!-- Form -->
            <div class="card">
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-4">
                            <label class="form-label">Title *</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Part Number *</label>
                            <select name="part_number" class="form-select" required>
                                <option value="1">Part 1</option>
                                <option value="2">Part 2</option>
                                <option value="3">Part 3</option>
                                <option value="4">Part 4</option>
                            </select>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="3"></textarea>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Audio File * (MP3)</label>
                            <input type="file" name="audio_file" class="form-control" 
                                   accept="audio/mpeg,audio/mp3" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Transcript</label>
                            <textarea name="transcript" class="form-control" rows="6" 
                                      placeholder="Full transcript of the audio..."></textarea>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Difficulty</label>
                                <select name="difficulty" class="form-select">
                                    <option value="easy">Easy</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="hard">Hard</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Topic</label>
                                <input type="text" name="topic" class="form-control" 
                                       placeholder="e.g., Travel, Education">
                            </div>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <a href="{{ url_for('admin.listening_sections') }}" class="btn btn-ghost">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary flex-grow-1">
                                <i class="fas fa-save"></i> Create Section
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
