<!-- app/templates/admin/vocabulary/topic_add.html -->

{% extends 'base.html' %}

{% block title %}Add Vocabulary Topic - Admin{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Header -->
            <div class="glass p-4 mb-4">
                <a href="{{ url_for('admin.vocabulary_topics') }}" class="btn btn-ghost btn-sm mb-3">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
                <h1 class="text-gradient mb-2">
                    <i class="fas fa-plus"></i> Add Vocabulary Topic
                </h1>
            </div>
            
            <!-- Form -->
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-4">
                            <label class="form-label">Name *</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Description</label>
                            <textarea name="description" class="form-control" rows="3"></textarea>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Icon (FontAwesome class)</label>
                            <input type="text" name="icon" class="form-control" 
                                   placeholder="fas fa-book" value="fas fa-book">
                            <small class="text-muted">
                                <i class="fas fa-info-circle"></i>
                                Visit <a href="https://fontawesome.com/icons" target="_blank">FontAwesome</a> for icons
                            </small>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Order</label>
                            <input type="number" name="order" class="form-control" value="0" min="0">
                        </div>
                        
                        <div class="d-flex gap-2">
                            <a href="{{ url_for('admin.vocabulary_topics') }}" class="btn btn-ghost">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary flex-grow-1">
                                <i class="fas fa-save"></i> Create Topic
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
