<!-- app/templates/admin/reading/passage_add.html -->

{% extends 'base.html' %}

{% block title %}Add Reading Passage - Admin{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <!-- Header -->
            <div class="glass p-4 mb-4">
                <a href="{{ url_for('admin.reading_passages') }}" class="btn btn-ghost btn-sm mb-3">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
                <h1 class="text-gradient mb-2">
                    <i class="fas fa-plus"></i> Add Reading Passage
                </h1>
            </div>
            
            <!-- Form -->
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-4">
                            <label class="form-label">Title *</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Passage Text *</label>
                            <textarea name="passage_text" class="form-control" rows="20" 
                                      style="font-family: monospace;" required></textarea>
                            <small class="text-muted">
                                <i class="fas fa-info-circle"></i>
                                Use line breaks to separate paragraphs
                            </small>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Topic</label>
                                <input type="text" name="topic" class="form-control" 
                                       placeholder="e.g., Science">
                            </div>
                            
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Difficulty</label>
                                <select name="difficulty" class="form-select">
                                    <option value="easy">Easy</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="hard">Hard</option>
                                </select>
                            </div>
                            
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Source</label>
                                <input type="text" name="source" class="form-control" 
                                       placeholder="Source URL or reference">
                            </div>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <a href="{{ url_for('admin.reading_passages') }}" class="btn btn-ghost">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary flex-grow-1">
                                <i class="fas fa-save"></i> Create Passage
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
