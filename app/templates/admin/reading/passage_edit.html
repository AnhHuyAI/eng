<!-- app/templates/admin/reading/passage_edit.html -->

{% extends 'base.html' %}

{% block title %}Edit Reading Passage - Admin{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="glass p-4 mb-4">
                <a href="{{ url_for('admin.reading_passages') }}" class="btn btn-ghost btn-sm mb-3">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
                <h1 class="text-gradient mb-2">
                    <i class="fas fa-edit"></i> Edit Reading Passage
                </h1>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-4">
                            <label class="form-label">Title *</label>
                            <input type="text" name="title" class="form-control" 
                                   value="{{ passage.title }}" required>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Passage Text *</label>
                            <textarea name="passage_text" class="form-control" rows="20" 
                                      style="font-family: monospace;" required>{{ passage.passage_text }}</textarea>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Topic</label>
                                <input type="text" name="topic" class="form-control" 
                                       value="{{ passage.topic or '' }}">
                            </div>
                            
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Difficulty</label>
                                <select name="difficulty" class="form-select">
                                    <option value="easy" {% if passage.difficulty == 'easy' %}selected{% endif %}>Easy</option>
                                    <option value="medium" {% if passage.difficulty == 'medium' %}selected{% endif %}>Medium</option>
                                    <option value="hard" {% if passage.difficulty == 'hard' %}selected{% endif %}>Hard</option>
                                </select>
                            </div>
                            
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Source</label>
                                <input type="text" name="source" class="form-control" 
                                       value="{{ passage.source or '' }}">
                            </div>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <a href="{{ url_for('admin.reading_passages') }}" class="btn btn-ghost">Cancel</a>
                            <button type="submit" class="btn btn-primary flex-grow-1">
                                <i class="fas fa-save"></i> Update Passage
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
